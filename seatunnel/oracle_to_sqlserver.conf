# =================================================================================
#  大连市皮肤病医院绩效测算 - Oracle -> SQL Server 批量同步 (SeaTunnel 2.3.8)
# =================================================================================
#
#  任务目标
#  --------
#  将 Oracle 源端 DL_PFM Schema 下 4 张 HIS 临时表, 幂等同步至 SQL Server 目标库
#  hospital_performance_dalian_derma 的 dbo Schema。
#
#  数据规模 (2026-09-11 实测)
#  --------------------------
#    PF临时医疗服务项目26A   12,206,289 行   ~2,432 MB
#    PF临时转诊数据26A          263,292 行      ~56 MB
#    PF临时收入院数据26A         20,012 行       ~3 MB
#    PF临时出院数据26A           19,213 行     ~0.9 MB
#    -------------------------------------------------
#    合计                     ~12,508,806 行   ~2.5 GB
#
#  幂等策略
#  --------
#  采用显式 query 模式 (显式 INSERT 语句 + ? 占位符), 写入前不做 DROP_DATA 清表;
#  目标表清空由 SQL Server 侧 (sqlserver/his_PF*.sql 幂等 DROP TABLE + CREATE TABLE)
#  或 python/sync_oracle_to_sqlserver.py 的 SYNC_TRUNCATE_FIRST 语义前置完成。
#
#  运行方式
#  --------
#   双击同目录 run_sync.bat , 或手工执行:
#     D:\Software\apache-seatunnel-2.3.8\bin\seatunnel.cmd --config <本文件绝对路径>
#
#  依赖
#  ----
#   D:\Software\apache-seatunnel-2.3.8\lib\ojdbc8-19.3.0.0.jar
#   D:\Software\apache-seatunnel-2.3.8\lib\mssql-jdbc-12.4.2.jre8.jar
#
#  =================================================================================
#  修改日志：
#  2026-09-11 17:05:00 | 配置修复 | 剔除 SeaTunnel 2.3.8 Jdbc Sink 不支持的 data_save_mode /
#                                 schema_save_mode / generate_sink_sql 三项非法参数, 改为显式
#                                 query 模式 (显式 INSERT + ? 占位符), 修复任务启动期参数校验秒退问题;
#                                 四表字段顺序严格对齐 sqlserver/his_PF*.sql 目标 DDL 列序
#  2026-09-11 16:30:00 | 配置新建 | 建立 Oracle DL_PFM -> SQL Server dbo 四表 BATCH 同步管道，
#                                 含 4 组 Jdbc Source/Sink、TRUNCATE 幂等、DECIMAL(18,8) 精度对齐
#  =================================================================================

env {
  # 批量任务模式 (非流式)
  job.mode = "BATCH"

  # 并行度: 源端单表超 1200 万行, 取 4 兼顾吞吐与 JDBC 连接压力
  parallelism = 4

  # 批量任务无需 checkpoint 恢复语义, 关闭以降低开销
  checkpoint.interval = 30000

  job.name = "oracle_to_sqlserver_dl_pfm"
}

# =================================================================================
#  源端: Oracle (192.168.130.32:1521/xepdb1, schema = DL_PFM)
#
#  读取策略:
#    table_path      : 显式限定 schema + 表名, 引擎据此开启主键自动分片读取;
#    split.size      : 每分片行数, 控制并行粒度 (千万级大表设 1000000);
#    query           : 显式列投影, 保证字段顺序与类型与目标端 DDL 严格一一对应;
#    decimal_type_narrowing = false : 关闭 DECIMAL 自动收窄, 保障
#                      数量/单价/金额 全精度传输 (对齐 .clinerules 第 7 节)。
# =================================================================================
source {
  # -------------------------------------------------------------------------------
  # Source 1: PF临时出院数据26A
  # -------------------------------------------------------------------------------
  Jdbc {
    plugin_output = "src_PF临时出院数据26A"
    driver = "oracle.jdbc.OracleDriver"
    url = "jdbc:oracle:thin:@192.168.130.32:1521/xepdb1"
    user = "system"
    password = "123456"
    table_path = "DL_PFM.PF临时出院数据26A"
    query = "SELECT 住院ID, 出院科室代码, 出院科室, 出院时间 FROM DL_PFM.\"PF临时出院数据26A\""
    connection_check_timeout_sec = 60
    split.size = 200000
    fetch_size = 10000
    decimal_type_narrowing = false
  }

  # -------------------------------------------------------------------------------
  # Source 2: PF临时收入院数据26A
  # -------------------------------------------------------------------------------
  Jdbc {
    plugin_output = "src_PF临时收入院数据26A"
    driver = "oracle.jdbc.OracleDriver"
    url = "jdbc:oracle:thin:@192.168.130.32:1521/xepdb1"
    user = "system"
    password = "123456"
    table_path = "DL_PFM.PF临时收入院数据26A"
    query = "SELECT 项目名称, 开单科室代码, 开单科室, 开单人员代码, 开单人, 开单时间, 执行科室代码, 执行科室, 执行人员代码, 执行人员, 入院登记时间, 患者ID, 挂号ID FROM DL_PFM.\"PF临时收入院数据26A\""
    connection_check_timeout_sec = 60
    split.size = 200000
    fetch_size = 10000
    decimal_type_narrowing = false
  }

  # -------------------------------------------------------------------------------
  # Source 3: PF临时医疗服务项目26A (超大表 ~1200 万行)
  # -------------------------------------------------------------------------------
  Jdbc {
    plugin_output = "src_PF临时医疗服务项目26A"
    driver = "oracle.jdbc.OracleDriver"
    url = "jdbc:oracle:thin:@192.168.130.32:1521/xepdb1"
    user = "system"
    password = "123456"
    table_path = "DL_PFM.PF临时医疗服务项目26A"
    query = "SELECT 项目大类, 项目代码, 项目名称, 开单科室代码, 开单科室, 开单人员代码, 开单人, 开单时间, 执行科室代码, 执行科室, 执行人员代码, 执行人员, 执行时间, 数量, 单价, 金额, 缴费时间, 患者ID, 挂号ID, HIS主键, 来源 FROM DL_PFM.\"PF临时医疗服务项目26A\""
    connection_check_timeout_sec = 60
    split.size = 1000000
    fetch_size = 20000
    decimal_type_narrowing = false
  }

  # -------------------------------------------------------------------------------
  # Source 4: PF临时转诊数据26A
  # -------------------------------------------------------------------------------
  Jdbc {
    plugin_output = "src_PF临时转诊数据26A"
    driver = "oracle.jdbc.OracleDriver"
    url = "jdbc:oracle:thin:@192.168.130.32:1521/xepdb1"
    user = "system"
    password = "123456"
    table_path = "DL_PFM.PF临时转诊数据26A"
    query = "SELECT 项目大类, 项目代码, 项目名称, 转诊后开单科室代码, 转诊后开单科室, 转诊后开单人员代码, 转诊开单人, 转诊后开单时间, 患者ID, 挂号ID, 首诊科室代码, 首诊科室, 首诊医生代码, 首诊医生, 执行时间, 数量, 单价, 金额, 缴费时间, HIS主键, 来源 FROM DL_PFM.\"PF临时转诊数据26A\""
    connection_check_timeout_sec = 60
    split.size = 200000
    fetch_size = 10000
    decimal_type_narrowing = false
  }
}

# =================================================================================
#  目标端: SQL Server (127.0.0.1:1433/hospital_performance_dalian_derma, schema = dbo)
#
#  幂等与写入策略:
#    1. 采用显式 query 模式: 显式书写 INSERT INTO dbo.[表名] (列清单) VALUES (?, ?, ...),
#       由 JDBC PreparedStatement 批量绑定上游流字段, 参数个数与 source 侧 query 投影列数严格一致。
#    2. 严禁使用 generate_sink_sql / database / table 自动建 SQL 三元组,
#       亦严禁使用 2.3.8 版 Jdbc Sink 不支持的 data_save_mode / schema_save_mode / pre_sql,
#       传入未知选项会触发任务启动期参数校验失败并秒退。
#    3. 字段顺序严格对齐 sqlserver/his_PF*.sql 目标 DDL 列序:
#         PF临时出院数据26A       4  列
#         PF临时收入院数据26A     13 列
#         PF临时医疗服务项目26A   21 列
#         PF临时转诊数据26A       21 列
#    4. 幂等重跑: 执行同步前先由 sqlserver/his_PF*.sql 幂等重建目标表,
#       或由 python/sync_oracle_to_sqlserver.py 的 SYNC_TRUNCATE_FIRST 清表,
#       保证任意次重跑结果一致。
# =================================================================================
sink {
  # -------------------------------------------------------------------------------
  # Sink 1: PF临时出院数据26A
  # -------------------------------------------------------------------------------
  Jdbc {
    plugin_input = "src_PF临时出院数据26A"
    driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    url = "jdbc:sqlserver://127.0.0.1:1433;databaseName=hospital_performance_dalian_derma;encrypt=false;trustServerCertificate=true"
    user = "sa"
    password = "YourStrongPassword123"
    query = "INSERT INTO dbo.[PF临时出院数据26A] (住院ID, 出院科室代码, 出院科室, 出院时间) VALUES (?, ?, ?, ?)"
    connection_check_timeout_sec = 60
    batch_size = 10000
    max_retries = 3
  }

  # -------------------------------------------------------------------------------
  # Sink 2: PF临时收入院数据26A
  # -------------------------------------------------------------------------------
  Jdbc {
    plugin_input = "src_PF临时收入院数据26A"
    driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    url = "jdbc:sqlserver://127.0.0.1:1433;databaseName=hospital_performance_dalian_derma;encrypt=false;trustServerCertificate=true"
    user = "sa"
    password = "YourStrongPassword123"
    query = "INSERT INTO dbo.[PF临时收入院数据26A] (项目名称, 开单科室代码, 开单科室, 开单人员代码, 开单人, 开单时间, 执行科室代码, 执行科室, 执行人员代码, 执行人员, 入院登记时间, 患者ID, 挂号ID) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)"
    connection_check_timeout_sec = 60
    batch_size = 10000
    max_retries = 3
  }

  # -------------------------------------------------------------------------------
  # Sink 3: PF临时医疗服务项目26A
  # -------------------------------------------------------------------------------
  Jdbc {
    plugin_input = "src_PF临时医疗服务项目26A"
    driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    url = "jdbc:sqlserver://127.0.0.1:1433;databaseName=hospital_performance_dalian_derma;encrypt=false;trustServerCertificate=true"
    user = "sa"
    password = "YourStrongPassword123"
    query = "INSERT INTO dbo.[PF临时医疗服务项目26A] (项目大类, 项目代码, 项目名称, 开单科室代码, 开单科室, 开单人员代码, 开单人, 开单时间, 执行科室代码, 执行科室, 执行人员代码, 执行人员, 执行时间, 数量, 单价, 金额, 缴费时间, 患者ID, 挂号ID, HIS主键, 来源) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)"
    connection_check_timeout_sec = 60
    batch_size = 10000
    max_retries = 3
  }

  # -------------------------------------------------------------------------------
  # Sink 4: PF临时转诊数据26A
  # -------------------------------------------------------------------------------
  Jdbc {
    plugin_input = "src_PF临时转诊数据26A"
    driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    url = "jdbc:sqlserver://127.0.0.1:1433;databaseName=hospital_performance_dalian_derma;encrypt=false;trustServerCertificate=true"
    user = "sa"
    password = "YourStrongPassword123"
    query = "INSERT INTO dbo.[PF临时转诊数据26A] (项目大类, 项目代码, 项目名称, 转诊后开单科室代码, 转诊后开单科室, 转诊后开单人员代码, 转诊开单人, 转诊后开单时间, 患者ID, 挂号ID, 首诊科室代码, 首诊科室, 首诊医生代码, 首诊医生, 执行时间, 数量, 单价, 金额, 缴费时间, HIS主键, 来源) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)"
    connection_check_timeout_sec = 60
    batch_size = 10000
    max_retries = 3
  }
}
